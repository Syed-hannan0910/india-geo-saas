version: '3.9'

services:
  # ── PostgreSQL (NeonDB-compatible) ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: india_geo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       india_geo
      POSTGRES_USER:     geo_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev_change_me}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=256MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=16MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_admin -d india_geo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: india_geo_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --appendonly no
        --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── API Server ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: india_geo_api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV:            production
      PORT:                3000
      DATABASE_URL:        postgres://geo_admin:${DB_PASSWORD:-localdev_change_me}@postgres:5432/india_geo
      REDIS_URL:           redis://redis:6379
      JWT_SECRET:          ${JWT_SECRET:-change_this_jwt_secret_32chars_min}
      JWT_REFRESH_SECRET:  ${JWT_REFRESH_SECRET:-change_this_refresh_secret_32chars}
      ALLOWED_ORIGINS:     ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3001}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── PgBouncer (connection pooler for 1M req/day scale) ───────────────────
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: india_geo_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRESQL_HOST:         postgres
      POSTGRESQL_PORT:         5432
      POSTGRESQL_DATABASE:     india_geo
      POSTGRESQL_USERNAME:     geo_admin
      POSTGRESQL_PASSWORD:     ${DB_PASSWORD:-localdev_change_me}
      PGBOUNCER_POOL_MODE:     transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE:     5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
    ports:
      - "5433:5432"
    profiles: ["scale"]   # Only start with: docker compose --profile scale up

  # ── Redis Sentinel (HA for production) ────────────────────────────────────
  redis-sentinel:
    image: bitnami/redis-sentinel:7.0
    container_name: india_geo_sentinel
    restart: unless-stopped
    depends_on: [redis]
    environment:
      REDIS_SENTINEL_QUORUM: 1
      REDIS_MASTER_HOST:     redis
    profiles: ["scale"]

  # ── Prometheus metrics scraper ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: india_geo_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["monitoring"]

  # ── Grafana dashboards ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: india_geo_grafana
    depends_on: [prometheus]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    profiles: ["monitoring"]

volumes:
  pg_data:
  grafana_data:

networks:
  default:
    name: india_geo_net
